name: 'Test typescript-action'
on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout source
      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      # Setup Node with npm cache
      - name: Setup Node with npm cache
        id: node-install
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # allow packages inside this repo to consume from our private npm registry
      - name: Authenticate against NPM
        run: |
          npm config set //npm.pkg.github.com/:_authToken=$GH_TOKEN
          npm config list
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PKG_REGISTRY_READ }}

      # Install dependencies
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Check code formatting
      - name: 'Check code formatting'
        run: npm run format:ci

      # Check code linting
      - name: 'Check code linting'
        run: npm run lint:ci

      # Build
      - name: Build
        run: npm run build

      - name: Check for Execution
        uses: ./
        with:
          skipOnCommitMsg: 'sample'
      - name: Some Job
        run: echo "sample"
